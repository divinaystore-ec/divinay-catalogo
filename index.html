<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divinay Store · Catálogo</title>
<style>
:root{--bg:#faf7f5;--ink:#1c1a1d;--mut:#8a8087;--accent:#b0396b;--gold:#b89455;--line:#e9e2de}
*{box-sizing:border-box}
body{margin:0;font-family:"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.hero{background:linear-gradient(135deg,#1c1a1d 0%,#3a2330 100%);color:#fff;text-align:center;padding:60px 20px 50px}
.hero small{letter-spacing:5px;text-transform:uppercase;color:var(--gold);font-size:.75rem}
.hero h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(2.2rem,7vw,3.6rem);margin:12px 0 8px;letter-spacing:3px}
.hero p{margin:0;color:#d8ccd2;font-weight:300}
.line{width:56px;height:2px;background:var(--gold);margin:20px auto 0}
nav{position:sticky;top:0;z-index:5;background:#fffdfc;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;justify-content:center;padding:0 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:16px 14px;cursor:pointer;font-size:.8rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);white-space:nowrap;border-bottom:2px solid transparent;font-family:inherit}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:32px 16px 60px}
.title{text-align:center;margin:0 0 26px}
.title h2{font:400 1.7rem Georgia,serif;margin:0;letter-spacing:2px}
.title p{margin:6px 0 0;color:var(--mut);font-size:.9rem}
.back{display:inline-block;border:0;background:none;color:var(--accent);cursor:pointer;font-size:.9rem;margin-bottom:14px;font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px 20px}
.card{background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 1px 3px #0001;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px #0002}
.ph{aspect-ratio:3/4;background:linear-gradient(160deg,#f3eaee,#eadde3);display:flex;align-items:center;justify-content:center;font-size:3.4rem;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.info{padding:16px;text-align:center}
.info h3{margin:0 0 6px;font:400 1.08rem Georgia,serif}
.price{font-size:1.25rem;font-weight:700;color:var(--accent);margin-bottom:10px}
.sizes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sizes span{border:1px solid var(--line);color:var(--mut);font-size:.75rem;padding:3px 9px;border-radius:2px}
/* tarjetas de sección */
.cat{cursor:pointer;position:relative;border-radius:4px;overflow:hidden;box-shadow:0 1px 3px #0002;transition:transform .25s,box-shadow .25s}
.cat:hover{transform:translateY(-5px);box-shadow:0 12px 26px #0003}
.cat .ph{aspect-ratio:4/5;font-size:4.2rem}
.cat .over{position:absolute;left:0;right:0;bottom:0;padding:46px 14px 16px;background:linear-gradient(transparent,#000c);color:#fff;text-align:center}
.cat .over h3{margin:0;font:400 1.4rem Georgia,serif;letter-spacing:2px;text-transform:uppercase}
.cat .over span{font-size:.78rem;letter-spacing:1.5px;color:#e8cfa5;text-transform:uppercase}
.empty{text-align:center;color:var(--mut);padding:60px 0}
footer{background:#1c1a1d;color:#b9aeb4;text-align:center;padding:30px 16px;font-size:.85rem}
footer b{color:#fff;font:400 1.05rem Georgia,serif;letter-spacing:2px}
footer a{color:var(--gold);text-decoration:none}
#social{margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#social a{border:1px solid #b89455;color:#fff;padding:8px 18px;border-radius:22px;font-size:.82rem;letter-spacing:1px}
#social a:hover{background:#b89455;color:#1c1a1d}
#adminBtn{display:none;position:fixed;right:14px;bottom:14px;background:#1c1a1d;color:#fff;border:0;border-radius:24px;padding:11px 16px;cursor:pointer;font-size:.8rem;opacity:.85;box-shadow:0 2px 8px #0005}
#panel{display:none;position:fixed;inset:0;z-index:20;background:#000a;align-items:center;justify-content:center;padding:14px}
#panel .box{background:#fff;border-radius:8px;padding:20px;max-width:420px;width:100%;max-height:92vh;overflow:auto}
#panel h3{margin:0;font:400 1.2rem Georgia,serif}
#panel label{display:block;margin:12px 0 4px;font-size:.8rem;color:var(--mut)}
#panel input,#panel select,#panel textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;font-size:1rem;font-family:inherit}
#panel .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
#panel button{padding:10px 16px;border:0;border-radius:4px;cursor:pointer;font-size:.9rem}
.ok{background:var(--accent);color:#fff}.gr{background:#eee}
textarea{font-family:monospace;font-size:.78rem}
</style>
</head>
<body>
<header class="hero"><small>Moda · Estilo · Elegancia</small><h1>DIVINAY STORE</h1><p>Colección de ropa para mujer</p><div class="line"></div></header>
<nav id="nav"></nav>
<main id="main"></main>
<footer><b>DIVINAY STORE</b><br>Consulta disponibilidad y pedidos por <a id="wa" target="_blank" rel="noopener" href="#">WhatsApp</a><div id="social"></div></footer>

<button id="adminBtn">＋ Agregar producto</button>
<div id="panel"><div class="box">
  <h3>Agregar producto</h3>
  <label>Sección</label><select id="fCat"></select>
  <label>Nombre</label><input id="fName" placeholder="Ej: Blusa floral">
  <label>Precio (USD)</label><input id="fPrice" type="number" step="0.01" placeholder="15">
  <label>Tallas</label><input id="fSizes" placeholder="S, M, L">
  <label>Foto (nombre del archivo, opcional)</label><input id="fImg" placeholder="blusa1.jpg">
  <div class="row"><button class="ok" id="add">Agregar</button><button class="gr" id="close">Cerrar</button></div>
  <hr style="margin:18px 0;border:0;border-top:1px solid #eee">
  <small>Para dejarlos fijos para todos, copia este texto y pégalo dentro de la lista PRODUCTOS del archivo:</small>
  <textarea id="out" rows="5" readonly></textarea>
  <div class="row"><button class="gr" id="copy">Copiar texto</button><button class="gr" id="clear">Borrar los agregados aquí</button></div>
</div></div>

<script>
/* 1) TU WHATSAPP (con código de país, sin + ni espacios) */
const WHATSAPP = "593000000000";

/* TUS REDES: escribe solo tu usuario, sin @ (ej: "divinaystore").
   Si dejas una vacía, no se muestra. */
const INSTAGRAM = "";
const TIKTOK = "";

/* 2) FOTO DE PORTADA DE CADA SECCIÓN (la que se ve en la página principal).
   Escribe el nombre del archivo que subas a GitHub. Si la dejas vacía,
   se usa la foto del primer producto de esa sección, o un ícono. */
const PORTADAS = {
  Blusas: "", Sacos: "", Bodys: "", Pantalones: "",
  Faldas: "", Conjuntos: "", Camisetas: "", Gorras: ""
};

/* 3) TUS PRODUCTOS: una línea por prenda.
   Formato: ["Sección", "Nombre", precio, "Tallas", "foto.jpg o vacío"] */
const PRODUCTOS = [
  ["Blusas",     "Blusa de ejemplo",    12, "S, M, L", ""],
  ["Sacos",      "Saco de ejemplo",     17, "Talla estándar", ""],
  ["Bodys",      "Body de ejemplo",     10, "S, M, L", ""],
  ["Pantalones", "Jean de ejemplo",     20, "28, 30, 32", ""],
  ["Faldas",     "Falda de ejemplo",    13, "S, M, L", ""],
  ["Conjuntos",  "Conjunto de ejemplo", 25, "S, M, L", ""],
  ["Camisetas",  "Camiseta de ejemplo",  8, "S, M, L", ""],
  ["Gorras",     "Gorra de ejemplo",     7, "Única", ""],
];

/* ====== Desde aquí no necesitas tocar nada ====== */
const CATS = ["Blusas","Sacos","Bodys","Pantalones","Faldas","Conjuntos","Camisetas","Gorras"];
const ICON = {Blusas:"👚",Sacos:"🧥",Bodys:"🩱",Pantalones:"👖",Faldas:"👗",Conjuntos:"👚",Camisetas:"👕",Gorras:"🧢"};
const $ = id => document.getElementById(id);
let extra = [], cur = "Todos";
try { extra = JSON.parse(localStorage.getItem("divinay_extra") || "[]"); } catch(e) {}
const save = () => { try { localStorage.setItem("divinay_extra", JSON.stringify(extra)); } catch(e) {} };
const all = () => PRODUCTOS.concat(extra);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("wa").href = "https://wa.me/" + WHATSAPP;
(function(){
  const clean = u => String(u).trim().replace(/^@/, "");
  const links = [];
  if (INSTAGRAM) links.push(`<a target="_blank" rel="noopener" href="https://www.instagram.com/${clean(INSTAGRAM)}">Instagram</a>`);
  if (TIKTOK) links.push(`<a target="_blank" rel="noopener" href="https://www.tiktok.com/@${clean(TIKTOK)}">TikTok</a>`);
  $("social").innerHTML = links.join("");
})();

function go(c){ cur = c; nav(); draw(); window.scrollTo({top:0,behavior:"smooth"}); }
function nav(){
  $("nav").innerHTML = ["Todos",...CATS].map(c => `<button class="${c===cur?"on":""}" data-c="${c}">${c}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.c));
}
function cover(c){
  const items = all().filter(p => p[0] === c);
  const img = PORTADAS[c] || (items.find(p => p[4]) || [])[4] || "";
  return {img, n: items.length};
}
function draw(){
  if (cur === "Todos") {
    $("main").innerHTML = `<div class="title"><h2>Nuestras secciones</h2><p>Toca una sección para ver todas las prendas</p></div><div class="grid">` +
      CATS.map(c => { const {img,n} = cover(c);
        return `<div class="cat" data-c="${c}"><div class="ph">${img ? `<img src="${esc(img)}" alt="${c}">` : ICON[c]}</div>
        <div class="over"><h3>${c}</h3><span>${n} ${n===1?"producto":"productos"}</span></div></div>`; }).join("") + `</div>`;
    $("main").querySelectorAll(".cat").forEach(el => el.onclick = () => go(el.dataset.c));
  } else {
    const list = all().filter(p => p[0] === cur);
    $("main").innerHTML = `<button class="back" id="back">← Todas las secciones</button><div class="title"><h2>${cur}</h2><p>${list.length} ${list.length===1?"producto":"productos"}</p></div>` +
      (list.length ? `<div class="grid">` + list.map(p => {
        const [cat,name,price,sizes,img] = p;
        const chips = String(sizes).split(",").map(s => s.trim()).filter(Boolean).map(s => `<span>${esc(s)}</span>`).join("");
        return `<div class="card"><div class="ph">${img ? `<img src="${esc(img)}" alt="${esc(name)}">` : ICON[cat]}</div>
        <div class="info"><h3>${esc(name)}</h3><div class="price">$${Number(price).toFixed(2)}</div><div class="sizes">${chips}</div></div></div>`;
      }).join("") + `</div>` : `<div class="empty">Pronto tendremos nuevos productos en esta sección.</div>`);
    $("back").onclick = () => go("Todos");
  }
  $("out").value = extra.map(p => "  " + JSON.stringify(p) + ",").join("\n");
}
$("fCat").innerHTML = CATS.map(c => `<option>${c}</option>`).join("");
$("adminBtn").onclick = () => $("panel").style.display = "flex";
$("close").onclick = () => $("panel").style.display = "none";
$("add").onclick = () => {
  const name = $("fName").value.trim(), price = parseFloat($("fPrice").value);
  if (!name || isNaN(price)) { alert("Escribe el nombre y el precio."); return; }
  extra.push([$("fCat").value, name, price, $("fSizes").value.trim() || "Única", $("fImg").value.trim()]);
  save(); ["fName","fPrice","fSizes","fImg"].forEach(i => $(i).value = ""); draw();
};
$("copy").onclick = () => { $("out").select(); try { document.execCommand("copy"); } catch(e) {} };
$("clear").onclick = () => { if (confirm("¿Borrar los productos agregados desde este botón?")) { extra = []; save(); draw(); } };
/* El botón de agregar solo aparece si abres el link terminado en #admin */
function adminCheck(){ $("adminBtn").style.display = location.hash === "#admin" ? "block" : "none"; }
window.addEventListener("hashchange", adminCheck); adminCheck();
nav(); draw();
</script>
</body>
</html>
